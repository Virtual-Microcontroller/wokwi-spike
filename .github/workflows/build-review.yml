name: Build Review

# Reviews a build that recovered from failure, comments on the commit, and
# removes the AI-HINT markers so the finished file is the author's own.
#
# This file is the trigger only; the behaviour lives in build-review-impl.yml.
on:
  workflow_run:
    workflows: [build]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: review-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  review:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      vars.AI_HINTS_ENABLED != 'false' &&
      github.event.workflow_run.head_commit.author.name != 'github-actions[bot]'
    uses: ./.github/workflows/build-review-impl.yml
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
